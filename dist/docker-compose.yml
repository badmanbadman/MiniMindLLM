version: '3.8'

services:
  # Nginx反向代理
  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"  # SSL端口（如果配置了HTTPS）
    depends_on:
      - model-api
      - streamlit-app
    restart: unless-stopped
    networks:
      - ml-network

  # 模型API服务
  model-api:
    build: ./model-api
    container_name: model-api
    environment:
      - MODEL_PATH=/app/models
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./logs/api:/app/logs
    restart: unless-stopped
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Streamlit前端应用
  streamlit-app:
    build: ./streamlit-app
    container_name: streamlit-app
    environment:
      - API_URL=http://model-api:5000
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_THEME_BASE=light
    volumes:
      - ./logs/streamlit:/app/logs
    restart: unless-stopped
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ml-network:
    driver: bridge